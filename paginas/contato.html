<!DOCTYPE html>
<html lang="PT- BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatos</title>
  <link rel="icon" href="../imagens/ICON-Fish.512.png">
  <link rel="stylesheet" href="../css/estilos_site.css">

  <!-- Carrega os componentes antes do body carregar -->
  <script src="../js/componentes.js"></script>
</head>

<body>
  <meu-header></meu-header>

  <div class="page-header">
    <h1>Fale com o Pesca Tech</h1>
  </div>
  <main class="page-content">
    <form class="form-contato" id="formulario">
      <input type="text" id="nome" placeholder="Seu nome">
      <input type="email" id="email" placeholder="Seu e-mail">
      <textarea rows="5" id="mensagem" placeholder="Sua mensagem sobre Engenharia de Pesca"></textarea>
      <button type="submit">Enviar mensagem</button>
    </form>
  </main>


  <meu-footer></meu-footer>

  <script src="../js/script.js" defer></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</body>

</html>
